<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-label="Platshållare: illustration av Väven i Umeå vid Umeälven">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16181d"/>
      <stop offset="1" stop-color="#0b0c0e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#c9a227"/>
      <stop offset="1" stop-color="#e8c86a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#sky)"/>
  <!-- Autumn sun glow -->
  <circle cx="620" cy="240" r="180" fill="#c9a227" opacity="0.10"/>
  <circle cx="620" cy="240" r="90" fill="#e8c86a" opacity="0.14"/>
  <!-- Väven-inspired building: sweeping white bands -->
  <g opacity="0.92">
    <path d="M60 560 Q 340 470 740 540 L740 620 Q 360 550 60 640 Z" fill="#f5f3ef" opacity="0.85"/>
    <path d="M60 660 Q 380 570 740 640 L740 700 Q 380 640 60 720 Z" fill="#f5f3ef" opacity="0.6"/>
    <path d="M60 740 Q 400 660 740 720 L740 760 Q 400 710 60 790 Z" fill="#f5f3ef" opacity="0.35"/>
  </g>
  <!-- Window band -->
  <g fill="#0b0c0e" opacity="0.5">
    <rect x="140" y="586" width="18" height="26" rx="2"/>
    <rect x="180" y="580" width="18" height="26" rx="2"/>
    <rect x="220" y="575" width="18" height="26" rx="2"/>
    <rect x="260" y="570" width="18" height="26" rx="2"/>
    <rect x="300" y="566" width="18" height="26" rx="2"/>
    <rect x="340" y="563" width="18" height="26" rx="2"/>
    <rect x="380" y="561" width="18" height="26" rx="2"/>
    <rect x="420" y="560" width="18" height="26" rx="2"/>
    <rect x="460" y="560" width="18" height="26" rx="2"/>
    <rect x="500" y="561" width="18" height="26" rx="2"/>
    <rect x="540" y="563" width="18" height="26" rx="2"/>
    <rect x="580" y="566" width="18" height="26" rx="2"/>
    <rect x="620" y="570" width="18" height="26" rx="2"/>
  </g>
  <!-- River with reflections -->
  <rect y="820" width="800" height="180" fill="#111317"/>
  <g stroke="url(#gold)" stroke-width="3" opacity="0.5" stroke-linecap="round">
    <line x1="120" y1="856" x2="220" y2="856"/>
    <line x1="300" y1="880" x2="430" y2="880"/>
    <line x1="520" y1="860" x2="640" y2="860"/>
    <line x1="200" y1="912" x2="330" y2="912"/>
    <line x1="470" y1="930" x2="560" y2="930"/>
  </g>
  <g stroke="#f5f3ef" stroke-width="2" opacity="0.25" stroke-linecap="round">
    <line x1="150" y1="890" x2="260" y2="890"/>
    <line x1="380" y1="905" x2="500" y2="905"/>
    <line x1="560" y1="945" x2="680" y2="945"/>
  </g>
  <text x="400" y="985" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#9ca3af">Platshållare - ersätt med foto på Väven i Umeå</text>
</svg>
